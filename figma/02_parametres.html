<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=390">
<title>Banco – Paramètres de jeu</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #7A14B8; display: flex; justify-content: center; font-family: 'Quicksand', sans-serif; }
.screen { width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #7A14B8 0%, #B867F2 55%, #7A14B8 100%); }
.header { background: white; padding: 52px 18px 22px; display: flex; align-items: center; gap: 12px; }
.back-btn { width: 34px; height: 34px; border-radius: 17px; background: #A64BE8;
  display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; flex-shrink: 0; }
.header-title { color: #A64BE8; font-weight: 700; font-size: 22px; }
.band { height: 14px; background: #CD94F0; }
.scroll { flex: 1; overflow: hidden; padding: 22px 16px 20px; display: flex; flex-direction: column; gap: 18px; }
.section-label { display: flex; align-items: center; justify-content: center; gap: 6px; }
.section-label span { color: #F3E2FF; font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 18px; }
.info-badge { width: 22px; height: 22px; border-radius: 11px; background: #CD94F0;
  display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; }
.modes-row { display: flex; gap: 16px; align-items: flex-end; }
.mode-card-wrap { flex: 1; position: relative; }
.mode-card { background: white; border-radius: 20px; padding: 18px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 150px; justify-content: center; }
.mode-icon { font-size: 48px; }
.mode-label { font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 20px; color: #111; }
.badge-check { position: absolute; top: -12px; right: -6px; width: 38px; height: 38px; border-radius: 19px; background: #15B1A1;
  display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; }
.badge-lock { position: absolute; top: -6px; right: -8px; width: 30px; height: 30px; border-radius: 15px; background: #CD94F0;
  display: flex; align-items: center; justify-content: center; color: white; font-size: 13px; }
.locked-wrap { margin-top: 26px; position: relative; }
.price-pill { height: 36px; border-radius: 18px; background: linear-gradient(90deg,#5BE5D6,#15B1A1); border: 2px solid #1C8277;
  display: flex; align-items: center; justify-content: center; padding: 0 16px;
  color: white; font-weight: 700; font-size: 15px; align-self: center; margin-top: 8px; }
.card { background: white; border-radius: 20px; overflow: hidden; }
.pack-row { display: flex; align-items: center; gap: 10px; padding: 16px; min-height: 76px; }
.pack-icon { width: 46px; display: flex; justify-content: center; font-size: 32px; }
.pack-label { flex: 1; text-align: center; font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 17px; color: #111; }
.divider { height: 1px; background: #F0E6FF; margin: 0 16px; }
.price-pill-sm { height: 36px; border-radius: 18px; background: linear-gradient(90deg,#5BE5D6,#15B1A1); border: 2px solid #1C8277;
  display: flex; align-items: center; padding: 0 14px; color: white; font-weight: 700; font-size: 14px; }
.totale { background: white; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.totale-texts { flex: 1; }
.totale-title { font-weight: 700; font-size: 16px; color: #A64BE8; }
.totale-sub { font-family: 'Roboto', sans-serif; font-weight: 500; font-size: 13px; color: #9A9A9A; margin-top: 2px; }
.totale-price { height: 40px; border-radius: 20px; background: linear-gradient(90deg,#5BE5D6,#15B1A1); border: 2px solid #1C8277;
  display: flex; align-items: center; padding: 0 18px; color: white; font-weight: 700; font-size: 16px; }
.footer { padding: 8px 20px 32px; display: flex; justify-content: flex-end; }
.next-btn { width: 104px; height: 50px; border-radius: 25px; background: linear-gradient(90deg,#5BE5D6,#15B1A1); border: 2px solid #1C8277;
  display: flex; align-items: center; justify-content: center; color: white; font-size: 26px; }
</style>
</head>
<body>
<div class="screen">
  <div class="header">
    <div class="back-btn">←</div>
    <div class="header-title">PARAMÈTRES DE JEU</div>
  </div>
  <div class="band"></div>
  <div class="scroll">
    <div class="section-label"><span>MODES DE JEU</span><div class="info-badge">i</div></div>
    <div class="modes-row">
      <div class="mode-card-wrap">
        <div class="mode-card"><div class="mode-icon">💡</div><div class="mode-label">CLASSIQUE</div></div>
        <div class="badge-check">✓</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column">
        <div class="locked-wrap">
          <div class="mode-card"><div class="mode-icon">🔥</div><div class="mode-label">STREAK</div></div>
          <div class="badge-lock">🔒</div>
        </div>
        <div class="price-pill">2,99 €</div>
      </div>
    </div>
    <div class="section-label"><span>PACK DE QUESTIONS</span><div class="info-badge">i</div></div>
    <div class="card">
      <div class="pack-row">
        <div class="pack-icon">⚽</div>
        <div class="pack-label">FOOTBALL</div>
        <div class="price-pill-sm">1,99 €</div>
      </div>
      <div class="divider"></div>
      <div class="pack-row">
        <div class="pack-icon">👾</div>
        <div class="pack-label">JEUX VIDÉO</div>
        <div class="price-pill-sm">1,99 €</div>
      </div>
    </div>
    <div class="totale">
      <div class="totale-texts">
        <div class="totale-title">OFFRE TOTALE</div>
        <div class="totale-sub">Tous les modes + packs inclus</div>
      </div>
      <div class="totale-price">5,99 €</div>
    </div>
  </div>
  <div class="footer"><div class="next-btn">⏩</div></div>
</div>
</body>
</html>
