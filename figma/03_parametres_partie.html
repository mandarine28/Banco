<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=390">
<title>Banco – Paramètres partie</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#7A14B8;display:flex;justify-content:center;font-family:'Quicksand',sans-serif}
.screen{width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#7A14B8 0%,#B867F2 55%,#7A14B8 100%)}
.header{background:white;padding:52px 18px 22px;display:flex;align-items:center;gap:12px}
.back-btn{width:34px;height:34px;border-radius:17px;background:#A64BE8;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;flex-shrink:0}
.header-title{color:#A64BE8;font-weight:700;font-size:22px}
.band{height:14px;background:#CD94F0}
.scroll{flex:1;padding:22px 16px 16px;display:flex;flex-direction:column;gap:18px}
.card{background:white;border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;min-height:76px;padding:12px 14px 12px 20px}
.row-label{flex:1;font-family:'Roboto',sans-serif;font-weight:700;font-size:17px;color:#111;display:flex;align-items:center;gap:8px}
.divider{height:1px;background:#F0E6FF;margin:0 16px}
.stepper{display:flex;align-items:center;gap:14px}
.step-btn{width:44px;height:44px;border-radius:22px;border:3px solid;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:white}
.step-val{font-weight:700;font-size:40px;min-width:44px;text-align:center}
.themes-btn-base{border-radius:12px;padding-bottom:3px;background:#1C8277}
.themes-btn{width:56px;height:48px;border-radius:12px;background:#5BE5D6;display:flex;align-items:center;justify-content:center;font-size:22px}
.price-pill{height:36px;border-radius:18px;background:linear-gradient(90deg,#5BE5D6,#15B1A1);border:2px solid #1C8277;display:inline-flex;align-items:center;padding:0 16px;color:white;font-weight:700;font-size:15px}
.totale{background:white;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.totale-title{font-weight:700;font-size:16px;color:#A64BE8}
.totale-sub{font-family:'Roboto',sans-serif;font-weight:500;font-size:13px;color:#9A9A9A;margin-top:2px}
.totale-price{height:40px;border-radius:20px;background:linear-gradient(90deg,#5BE5D6,#15B1A1);border:2px solid #1C8277;display:flex;align-items:center;padding:0 18px;color:white;font-weight:700;font-size:16px}
.footer{padding:8px 20px 32px;display:flex;justify-content:flex-end}
.next-btn{width:104px;height:50px;border-radius:25px;background:linear-gradient(90deg,#5BE5D6,#15B1A1);border:2px solid #1C8277;display:flex;align-items:center;justify-content:center;color:white;font-size:26px}
</style>
</head>
<body>
<div class="screen">
  <div class="header"><div class="back-btn">←</div><div class="header-title">PARAMÈTRES DE JEU</div></div>
  <div class="band"></div>
  <div class="scroll">
    <div class="card">
      <div class="row">
        <div class="row-label">NOMBRE D'ÉQUIPES</div>
        <div class="stepper">
          <div class="step-btn" style="border-color:#FBB040;color:#FBB040">−</div>
          <div class="step-val" style="color:#FBB040">2</div>
          <div class="step-btn" style="border-color:#FBB040;color:#FBB040">+</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="row">
        <div class="row-label">NOMBRE DE ROUNDS</div>
        <div class="stepper">
          <div class="step-btn" style="border-color:#EA1E63;color:#EA1E63">−</div>
          <div class="step-val" style="color:#EA1E63">3</div>
          <div class="step-btn" style="border-color:#EA1E63;color:#EA1E63">+</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="row">
        <div class="row-label">THÈMES DE QUESTIONS</div>
        <div class="themes-btn-base"><div class="themes-btn">⚙️</div></div>
      </div>
      <div class="divider"></div>
      <div class="row">
        <div class="row-label"><span style="font-size:32px">🃏</span>JOKERS<span style="width:22px;height:22px;border-radius:11px;background:#CD94F0;display:inline-flex;align-items:center;justify-content:center;color:white;font-size:13px;font-weight:700;margin-top:-10px">i</span></div>
        <div class="price-pill">1,99 €</div>
      </div>
    </div>
    <div style="flex:1;min-height:12px"></div>
    <div class="totale">
      <div style="flex:1"><div class="totale-title">OFFRE TOTALE</div><div class="totale-sub">Tous les modes + packs inclus</div></div>
      <div class="totale-price">5,99 €</div>
    </div>
  </div>
  <div class="footer"><div class="next-btn">⏩</div></div>
</div>
</body></html>
