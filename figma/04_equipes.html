<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=390">
<title>Banco – Configuration équipes</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#7A14B8;display:flex;justify-content:center;font-family:'Quicksand',sans-serif}
.screen{width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#7A14B8 0%,#B867F2 55%,#7A14B8 100%)}
.header{background:white;padding:52px 18px 22px;display:flex;align-items:center;gap:12px}
.back-btn{width:34px;height:34px;border-radius:17px;background:#A64BE8;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;flex-shrink:0}
.header-title{color:#A64BE8;font-weight:700;font-size:20px}
.band{height:14px;background:#CD94F0}
.scroll{flex:1;padding:22px 16px 20px}
.card{background:white;border-radius:20px;padding:16px 22px 26px;display:flex;flex-direction:column;align-items:center;gap:22px}
.step-counter{align-self:flex-end;color:#A64BE8;font-weight:700;font-size:28px}
.label{font-family:'Roboto',sans-serif;font-weight:700;font-size:16px;color:#111;text-align:center}
.colors-row{display:flex;justify-content:center;gap:18px}
.swatch-ring{padding:4px;border-radius:30px;border:3px solid transparent;cursor:pointer}
.swatch-ring.selected{border-color:#A64BE8}
.swatch{width:52px;height:52px;border-radius:26px}
.input-field{align-self:stretch;height:64px;padding:0 28px;border-radius:18px;border:3px solid #A64BE8;background:#CD94F0;color:white;font-family:'Quicksand',sans-serif;font-weight:700;font-size:26px;display:flex;align-items:center;letter-spacing:1px}
.actions{align-self:stretch;display:flex;justify-content:flex-end;padding-top:8px}
.next-label-btn{height:52px;border-radius:26px;background:linear-gradient(90deg,#5BE5D6,#15B1A1);border:2px solid #1C8277;padding:0 22px;display:flex;align-items:center;color:white;font-weight:700;font-size:28px;letter-spacing:.5px}
</style>
</head>
<body>
<div class="screen">
  <div class="header"><div class="back-btn">←</div><div class="header-title">CONFIGURATION DES ÉQUIPES</div></div>
  <div class="band"></div>
  <div class="scroll">
    <div class="card">
      <div class="step-counter">1/2</div>
      <div class="label">CHOISISSEZ LA COULEUR DE L'ÉQUIPE</div>
      <div class="colors-row">
        <div class="swatch-ring selected"><div class="swatch" style="background:#FBB040"></div></div>
        <div class="swatch-ring"><div class="swatch" style="background:#16D3C3"></div></div>
        <div class="swatch-ring"><div class="swatch" style="background:#F21F66"></div></div>
        <div class="swatch-ring"><div class="swatch" style="background:#4FB3FF"></div></div>
      </div>
      <div class="label">INSÉRER LE NOM DE L'ÉQUIPE</div>
      <div class="input-field">ÉQUIPE 1</div>
      <div class="actions">
        <div class="next-label-btn">SUIVANT</div>
      </div>
    </div>
  </div>
</div>
</body></html>
