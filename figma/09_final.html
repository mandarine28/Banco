<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=390">
<title>Banco – Fin de partie</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#7A14B8;display:flex;justify-content:center;font-family:'Quicksand',sans-serif}
.screen{width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#7A14B8 0%,#B867F2 60%,#7A14B8 100%)}
.top{display:flex;align-items:center;gap:12px;padding:52px 14px 12px}
.home-btn{width:42px;height:42px;border-radius:21px;background:#A64BE8;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 3px 0 #5B0FA0}
.banner-base{flex:1;border-radius:12px;background:white;padding-bottom:3px}
.banner{height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#EA1E63}
.scroll{flex:1;padding:4px 14px 16px;display:flex;flex-direction:column;gap:18px}
.card{background:white;border-radius:20px}
.podium{padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.trophy{font-size:64px;line-height:1}
.title{font-weight:700;font-size:28px;color:#A64BE8;text-align:center}
.ranking-card{overflow:hidden}
.rank-row{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 18px}
.rank-row.winner{background:#FFF4DF}
.rank-num{width:22px;color:#A64BE8;font-weight:700;font-size:22px}
.dot{width:18px;height:18px;border-radius:9px;flex-shrink:0}
.rank-name{flex:1;font-family:'Roboto',sans-serif;font-weight:700;font-size:17px;color:#111}
.crown{font-size:20px}
.rank-score{min-width:30px;text-align:right;font-weight:700;font-size:24px;color:#111}
.divider{height:1px;background:#F0E6FF;margin:0 16px}
.actions{display:flex;flex-direction:column;gap:14px;padding:6px 30px 28px}
.gbtn-wrap{border-radius:16px;padding-bottom:4px}
.gbtn-wrap.pink{background:#8C1B47}
.gbtn-wrap.teal{background:#1C8277}
.gbtn-inner{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:20px}
.gbtn-wrap.pink .gbtn-inner{background:#EA1E63;color:white}
.gbtn-wrap.teal .gbtn-inner{background:#5BE5D6;color:white}
</style>
</head>
<body>
<div class="screen">
  <div class="top">
    <div class="home-btn">🏠</div>
    <div class="banner-base"><div class="banner"><span style="color:white;font-weight:700;font-size:22px">FIN DE LA PARTIE</span></div></div>
    <div style="width:30px"></div>
  </div>
  <div class="scroll">
    <div class="card podium">
      <div class="trophy">🏆</div>
      <div class="title">VICTOIRE DE ÉQUIPE 1 !</div>
    </div>
    <div class="card ranking-card">
      <div class="rank-row winner">
        <div class="rank-num">1</div>
        <div class="dot" style="background:#FBB040"></div>
        <div class="rank-name">ÉQUIPE 1</div>
        <div class="crown">👑</div>
        <div class="rank-score">21</div>
      </div>
      <div class="divider"></div>
      <div class="rank-row">
        <div class="rank-num">2</div>
        <div class="dot" style="background:#16D3C3"></div>
        <div class="rank-name">ÉQUIPE 2</div>
        <div class="rank-score">14</div>
      </div>
    </div>
  </div>
  <div class="actions">
    <div class="gbtn-wrap pink"><div class="gbtn-inner">🔄 REJOUER</div></div>
    <div class="gbtn-wrap teal"><div class="gbtn-inner">🏠 ACCUEIL</div></div>
  </div>
</div>
</body></html>
